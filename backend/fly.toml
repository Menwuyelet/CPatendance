# fly.toml app configuration file generated for cpat-backend
# See https://fly.io/docs/reference/configuration/

app = "cpat-backend"
primary_region = "cdg"

[build]

[env]
  DJANGO_DB_PATH = "/data/db.sqlite3"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[mounts]]
  source = "data"
  destination = "/data"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
