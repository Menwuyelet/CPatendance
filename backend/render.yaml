services:
  - type: web
    name: cpatendance-backend
    env: python
    repo: https://github.com/yourusername/CPatendance.git
    branch: melkamu
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cpatendance_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://cpatendance.netlify.app"
      - key: ONNX_RUNTIME_CPU_ENABLED
        value: "1"
    disks:
      - name: media
        mountPath: /app/backend/media
        sizeGB: 1

databases:
  - name: cpatendance_db
    plan: free
    databaseName: cpatendance
    user: cpatendance
